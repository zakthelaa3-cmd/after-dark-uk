<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>After Dark: UK V5</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b0d10;color:#f4f6f8;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
body{overflow:hidden}.app{height:100vh;height:100dvh;max-width:1100px;margin:auto;padding:6px;display:flex;flex-direction:column;gap:6px}
header{display:flex;align-items:center;justify-content:space-between;min-height:42px}.title{font-size:clamp(21px,5vw,30px);font-weight:800}.subtitle{font-size:10px;color:#9da5af}
button{border:1px solid #3d444e;background:#242a32;color:#fff;border-radius:9px;padding:8px 9px;font-weight:650;font-size:12px;cursor:pointer}button:active{transform:scale(.97)}
.danger{border-color:#69444a}
.dashboard{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(0,1fr) auto;gap:6px;flex:1;min-height:0}
.panel{background:#16191e;border:1px solid #2b3037;border-radius:11px;padding:8px;min-width:0;overflow:hidden}.panel h2{font-size:13px;margin:0 0 6px}
.dashboard>.panel:first-child{grid-column:1/3;grid-row:1}.dashboard>.panel:nth-child(3){grid-column:1/3;grid-row:2;min-height:0}.dashboard>.actionsPanel{grid-column:1/3;grid-row:3}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.stat{background:#101216;border:1px solid #272c33;border-radius:7px;padding:5px}.stat b{display:block;font-size:9px;color:#9ea6b0}.stat span{display:block;font-size:11px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.location{margin-top:6px;display:flex;gap:4px;align-items:center}.locationName{font-size:12px;font-weight:800;background:#101216;border-radius:7px;padding:5px 7px;min-width:105px}.location .btnGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;flex:1}.location .btnGrid button{width:100%;padding:7px 3px;font-size:11px}
.actionsPanel{display:flex;flex-direction:column}.actionsPanel .btnGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.actionsPanel .btnGrid button{width:100%;min-height:46px;padding:9px 5px;font-size:12px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:6px}.tabs button{padding:7px 2px;font-size:11px}
.content{height:100%;min-height:0;display:flex;flex-direction:column}.actionBox{display:flex;gap:4px;margin-bottom:5px}input{min-width:0;flex:1;padding:8px;background:#0f1115;color:#fff;border:1px solid #3b414a;border-radius:8px;font-size:12px}.actionBox button{white-space:nowrap}
.notice{font-size:10px;color:#aeb5be;background:#101216;border:1px solid #272c33;border-radius:7px;padding:6px;margin-bottom:5px}.log{font-size:11px;line-height:1.35;white-space:pre-wrap;background:#101216;border:1px solid #272c33;border-radius:8px;padding:7px;flex:1;min-height:0;overflow:auto}
.cardBody{min-height:0;overflow:auto;flex:1}.item{background:#101216;border:1px solid #2a3037;border-radius:7px;padding:6px;margin-bottom:5px;font-size:10px}.item b{font-size:11px}.item button{margin-top:4px;padding:5px 8px;font-size:10px}.hidden{display:none!important}.bottom{font-size:9px;color:#737b86;text-align:center}
@media(max-width:760px){
.app{padding:4px;gap:4px}.subtitle{display:none}.dashboard{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto;gap:4px}
.dashboard>.panel:first-child,.dashboard>.panel:nth-child(3),.dashboard>.actionsPanel{grid-column:1}.dashboard>.panel:first-child{grid-row:1}.dashboard>.panel:nth-child(3){grid-row:2}.dashboard>.actionsPanel{grid-row:3}
.panel{padding:5px;border-radius:9px}.stats{grid-template-columns:repeat(4,1fr)}.stat{padding:3px}.stat b{font-size:7px}.stat span{font-size:9px}
.location{display:flex;gap:4px;align-items:center}.locationName{margin:0;min-width:70px;font-size:9px}.location .btnGrid{grid-template-columns:repeat(5,1fr);flex:1}.location .btnGrid button{font-size:8px;padding:5px 1px}
.actionsPanel h2{font-size:14px;margin-bottom:5px}.actionsPanel .btnGrid{grid-template-columns:repeat(5,1fr);gap:4px}.actionsPanel .btnGrid button{font-size:10px;padding:7px 2px;min-height:42px}
.tabs button{font-size:9px;padding:6px 1px}.actionBox input{font-size:10px;padding:6px}.actionBox button{font-size:9px;padding:6px}.log{font-size:9px}.notice{font-size:8px}.headerBtns button{font-size:9px;padding:6px}.title{font-size:20px}
}
@media(max-width:430px){.actionsPanel .btnGrid{grid-template-columns:repeat(2,1fr)}.actionsPanel .btnGrid button{min-height:44px;font-size:11px}.locationName{min-width:64px}.location .btnGrid button{font-size:7px}}
@media(max-height:600px){.stats{grid-template-columns:repeat(8,1fr)}.actionsPanel .btnGrid button{min-height:38px;padding:5px 2px}}
</style>
</head>
<body>
<div class="app">
<header><div><div class="title">🇬🇧 After Dark: UK</div><div class="subtitle">V5 · compact UK life simulator · offline playable</div></div><div class="headerBtns"><button id="newGame" class="danger">🆕 New Game</button></div></header>
<div class="dashboard">
<section class="panel">
<h2>📊 Your life</h2><div id="stats" class="stats"></div>
<div class="location"><div id="locationText" class="locationName">London</div><div class="btnGrid">
<button data-move="High Street">Street</button><button data-move="Town Centre">Town</button><button data-move="Estate">Estate</button><button data-move="Train Station">Station</button><button data-move="Home">Home</button>
</div></div>
</section>
<section class="panel actionsPanel">
<h2>🎮 Actions</h2><div class="btnGrid">
<button data-action="job">💼 Find job</button><button data-action="work">🧰 Work</button><button data-action="side">💷 Side job</button><button data-action="beg">🗣️ Beg</button><button data-action="steal">⚠️ Risky crime</button><button data-action="gamble">🎰 Casino</button><button data-action="faction">👥 Faction</button><button data-action="safe">🛡️ Stay safe</button><button data-action="sleep">😴 Sleep</button><button id="randomEvent">🎲 Event</button>
</div>
</section>
<section class="panel">
<div class="tabs"><button data-tab="story">Story</button><button data-tab="jobs">Jobs</button><button data-tab="factions">Groups</button><button data-tab="money">Money</button></div>
<div id="story" class="content"><div class="actionBox"><input id="actionInput" autocomplete="off" placeholder="Type an action…"><button id="takeAction">Go</button></div><div class="notice">Start with £0. Find work, earn money and manage your life.</div><div id="log" class="log"></div></div>
<div id="jobs" class="content hidden"><div class="cardBody"><div id="jobList"></div></div></div>
<div id="factions" class="content hidden"><div class="cardBody"><div id="factionList"></div></div></div>
<div id="money" class="content hidden"><div class="cardBody"><div id="moneyPanel"></div></div></div>
</section>
</div>
<div class="bottom">Fictional game world · virtual money only</div>
</div>
<script>
(()=>{const KEY="after-dark-uk-v4";const fresh={age:18,cash:0,bank:0,job:"Unemployed",wage:0,xp:0,energy:100,rep:0,heat:0,day:1,hour:7,location:"London",rent:650,home:false,faction:null,debt:0};let state;try{state=JSON.parse(localStorage.getItem(KEY))||{...fresh}}catch(e){state={...fresh}}
const jobs=[["Café assistant",12.5,0],["Retail assistant",12.8,1],["Warehouse operative",13.2,2],["Junior office assistant",13.5,3],["Apprentice electrician",14,4]],factions=["Borough Crew","Northline","Kingsway Collective"],$=id=>document.getElementById(id),money=n=>"£"+Number(n).toFixed(2);
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function clamp(){state.energy=Math.max(0,Math.min(100,state.energy));state.heat=Math.max(0,Math.min(10,state.heat));state.rep=Math.max(-10,Math.min(20,state.rep))}
function advance(h=1){state.hour+=h;state.energy=Math.max(0,state.energy-h*4);while(state.hour>=24){state.hour-=24;state.day++}}
function say(t){let e=$("log");e.textContent+=(e.textContent?"\n\n":"")+t;e.scrollTop=e.scrollHeight}
function render(){$("stats").innerHTML=`<div class="stat"><b>Day / time</b><span>${state.day} · ${String(state.hour).padStart(2,"0")}:00</span></div><div class="stat"><b>Cash</b><span>${money(state.cash)}</span></div><div class="stat"><b>Bank</b><span>${money(state.bank)}</span></div><div class="stat"><b>Job</b><span>${state.job}</span></div><div class="stat"><b>Energy</b><span>${state.energy}%</span></div><div class="stat"><b>XP</b><span>${state.xp}</span></div><div class="stat"><b>Rep</b><span>${state.rep}</span></div><div class="stat"><b>Heat</b><span>${state.heat}/10</span></div>`;$("locationText").textContent=state.location;
$("jobList").innerHTML=jobs.map((j,i)=>`<div class="item"><b>${j[0]}</b> · ${money(j[1])}/hr · XP ${j[2]}<br><button data-job="${i}">Apply</button></div>`).join("");
$("factionList").innerHTML=factions.map((f,i)=>`<div class="item"><b>${f}</b><br>Fictional group<br><button data-faction="${i}">Meet</button></div>`).join("");
$("moneyPanel").innerHTML=`<div class="item">💷 Cash: <b>${money(state.cash)}</b><br>🏦 Bank: <b>${money(state.bank)}</b><br>🏠 Rent: <b>${money(state.rent)}/week</b><br>🏡 Home: <b>${state.home?"Yes":"No"}</b><br>💳 Debt: <b>${money(state.debt)}</b></div>${state.home?'<button id="payRent">Pay rent</button>':'<button id="getHome">Rent room (£200)</button>'}`;clamp()}
function action(text){let a=text.trim(),x=a.toLowerCase();if(!a)return;let r="";
if(x.includes("sleep")){state.energy=100;state.hour=8;state.day++;r="You rest somewhere safe and start a new day."}
else if(x.includes("job")||x.includes("work")){if(x.includes("work")&&!x.includes("look")&&state.job!=="Unemployed"){if(state.energy<25)r="You're too tired for a full shift. Rest first.";else{let p=state.wage*7.5;state.bank+=p;state.xp++;advance(8);r=`You work a shift as a ${state.job}. ${money(p)} goes into your bank.`}}else if(state.job==="Unemployed")r="Open Jobs and choose a job to apply for.";else r=`You already work as a ${state.job}. Tap Work to do a shift.`}
else if(x.includes("beg")){let g=Math.floor(Math.random()*16);state.cash+=g;state.rep--;advance(2);r=g?`You receive ${money(g)} from passers-by.`:"Nobody gives you anything this time."}
else if(x.includes("gambl")||x.includes("casino")){if(state.cash<1)r="You need at least £1 of in-game cash to gamble.";else{let s=Math.min(state.cash,Math.max(1,Math.floor(state.cash*.25)));if(Math.random()<.45){let w=s*2;state.cash+=w;r=`You win ${money(w)} at the fictional casino.`}else{state.cash-=s;r=`You lose ${money(s)} at the fictional casino.`}advance(1)}}
else if(x.includes("steal")||x.includes("rob")||x.includes("crime")){state.heat=Math.min(10,state.heat+2);state.rep--;advance(2);r="You take a fictional risky-crime action. The game handles it abstractly with possible money and police-heat consequences.";if(Math.random()<.35){let g=20+Math.floor(Math.random()*81);state.cash+=g;r+=` This time you receive ${money(g)} in-game.`}}
else if(x.includes("side")||x.includes("odd job")){let g=20+Math.floor(Math.random()*41);state.cash+=g;state.xp++;advance(3);r=`You complete a legitimate odd job and earn ${money(g)}.`}
else if(x.includes("safe")||x.includes("avoid")){state.heat=Math.max(0,state.heat-1);advance(1);r="You keep your head down. Police heat drops slightly."}
else if(x.includes("home")){r=state.home?"You head home and relax.":"You don't have a home yet. Open Money to see the room option.";advance(1)}
else if(x.includes("faction")||x.includes("gang")){r="Open Groups to meet a fictional faction.";advance(1)}
else{advance(1);r="Your action is recorded. Time moves forward in the offline game."}
clamp();save();say("YOU: "+a+"\n\n"+r);$("actionInput").value="";render()}
function applyJob(i){let j=jobs[i];if(state.xp<j[2]){say(`JOB: You need ${j[2]} XP for ${j[0]}.`);return}state.job=j[0];state.wage=j[1];state.rep++;save();render();say(`JOB: You got the ${j[0]} job at ${money(j[1])}/hour.`)}
function meetFaction(i){state.faction=factions[i];state.rep++;save();render();say(`GROUP: You meet ${state.faction}.`)}
function move(w){state.location=w;advance(1);say(`TRAVEL: You travel to ${w}.`);save();render()}
function randomEvent(){let e=["A café needs cover for a shift.","A warehouse offers weekend overtime.","Someone offers a legitimate moving job.","You spot a job advert in a shop window.","A suspicious stranger mentions quick money. You can choose your own risk.","A manager notices your effort and suggests applying again."];say("EVENT: "+e[Math.floor(Math.random()*e.length)])}
function newGame(){if(confirm("Start a new V4 game? Your current V4 save will be erased.")){state={...fresh};localStorage.removeItem(KEY);$("log").textContent="";say("DAY 1 — 07:00\n\nYou are 18, unemployed and starting with £0. Find income and build your life.");render()}}
document.addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.move){move(b.dataset.move);return}if(b.dataset.action){let m={job:"look for a job",work:"work a shift",side:"find a side job",beg:"beg",steal:"risky crime",gamble:"gamble",faction:"meet a faction",safe:"stay safe",sleep:"sleep"};action(m[b.dataset.action]);return}if(b.dataset.tab){["story","jobs","factions","money"].forEach(id=>$(id).classList.toggle("hidden",id!==b.dataset.tab));return}if(b.dataset.job!==undefined){applyJob(+b.dataset.job);return}if(b.dataset.faction!==undefined){meetFaction(+b.dataset.faction);return}if(b.id==="takeAction"){action($("actionInput").value);return}if(b.id==="randomEvent"){randomEvent();return}if(b.id==="newGame"){newGame();return}if(b.id==="payRent"){if(state.bank>=state.rent){state.bank-=state.rent;state.rep++;say("BILLS: You pay your rent.");save();render()}else say("BILLS: You can't afford the rent yet.");return}if(b.id==="getHome"){if(state.cash>=200){state.cash-=200;state.home=true;say("HOME: You rent a basic room. Weekly rent is "+money(state.rent)+".");save();render()}else say("HOME: You need £200 for the deposit.")}});
$("actionInput").addEventListener("keydown",e=>{if(e.key==="Enter")action(e.target.value)});render();if(!$("log").textContent)say("DAY 1 — 07:00\n\nYou are 18, unemployed and starting with £0. Find income and build your life.");
})();
</script>
</body>
</html>
