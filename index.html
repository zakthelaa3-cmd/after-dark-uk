<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>After Dark: UK V10</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#070b12;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}body{overflow:hidden}.app{height:100vh;height:100dvh;max-width:1050px;margin:auto;padding:8px;display:flex;flex-direction:column;gap:7px}header{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:2px 5px}.title{font-size:clamp(24px,6vw,34px);font-weight:900;letter-spacing:.2px}.subtitle{font-size:12px;color:#8fa4bf}.newGame{border:1px solid #147bd1;background:#10253b;color:#fff;border-radius:12px;padding:10px 14px;font-weight:800;font-size:12px}.life,.game{background:#101720;border:1px solid #213248;border-radius:16px}.life{padding:9px}.life h2{font-size:16px;margin:0 0 7px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.stat{background:#0a1018;border:1px solid #203149;border-radius:10px;padding:7px}.stat b{display:block;font-size:9px;color:#91a7c0}.stat span{display:block;font-size:12px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.location{margin-top:6px;display:flex;align-items:center;gap:6px;background:#0a1018;border:1px solid #203149;border-radius:10px;padding:7px;font-size:12px}.location b{color:#91a7c0}.game{padding:9px;display:flex;flex-direction:column;min-height:0;flex:1}.commandHint{font-size:11px;color:#aebbd0;background:#0a1018;border:1px solid #203149;border-radius:10px;padding:7px;margin-bottom:6px}.log{flex:1;min-height:0;overflow:auto;background:#080d14;border:1px solid #203149;border-radius:11px;padding:10px;font-size:13px;line-height:1.45;white-space:pre-wrap}.inputRow{display:flex;gap:6px;margin-top:7px}input{min-width:0;flex:1;padding:12px;background:#070b12;color:#fff;border:1px solid #34506e;border-radius:11px;font-size:14px;outline:none}input:focus{border-color:#1597ff;box-shadow:0 0 0 2px #1597ff22}.sendBtn{min-width:62px;background:#0b73c9;border-color:#1597ff}.quickActions{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:7px}.quickActions button{min-height:42px;padding:8px 4px;font-size:10px;border:1px solid #29415d;background:#182432;color:#fff;border-radius:10px;font-weight:800}.quickActions button:active{transform:scale(.96);background:#24364b}.bottom{font-size:9px;color:#66788c;text-align:center}.commands{display:none}@media(max-width:760px){.app{padding:6px;gap:5px}.subtitle{display:block;font-size:10px}.newGame{padding:8px 10px}.stats{grid-template-columns:repeat(4,1fr);gap:4px}.stat{padding:5px}.stat b{font-size:7px}.stat span{font-size:10px}.life h2{font-size:14px}.game{padding:7px}.log{font-size:12px;padding:9px}.quickActions{grid-template-columns:repeat(4,1fr);gap:4px}.quickActions button{font-size:9px;min-height:40px;padding:7px 2px}}@media(max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}.quickActions button{min-height:37px}.title{font-size:22px}.newGame{font-size:10px;padding:7px 8px}}
</style>
</head>
<body>
<div class="app">
<header><div><div class="title">🇬🇧 AFTER DARK: UK</div><div class="subtitle">Your story. Your choices.</div></div><button id="newGame" class="newGame">👑 New Game</button></header>
<section class="life"><h2>📊 Your life</h2><div id="stats" class="stats"></div><div class="location"><b>Location:</b> <span id="locationText">London</span> · <b>Type:</b> text adventure</div></section>
<section class="game"><div class="commandHint">Type what you want to do, or tap a Quick Action. The buttons use the same game commands.</div><div id="log" class="log"></div><div id="quickActions" class="quickActions">
<button data-cmd="find a job">💼 Job</button>
<button data-cmd="work">🧰 Work</button>
<button data-cmd="side job">💷 Side Job</button>
<button data-cmd="go town">🏙️ Town</button>
<button data-cmd="gangs">👥 Gangs</button>
<button data-cmd="gang mission">🎯 Gang</button>
<button data-cmd="beg">🗣️ Beg</button>
<button data-cmd="casino">🎰 Casino</button>
<button data-cmd="risky crime">⚠️ Crime</button>
<button data-cmd="sleep">😴 Sleep</button>
<button data-cmd="money">💷 Money</button>
<button data-cmd="help">❓ Help</button>
</div><div class="inputRow"><input id="actionInput" autocomplete="off" placeholder="What do you want to do?"><button id="sendBtn" class="sendBtn">➤</button></div><div class="commands">Quick actions are shortcuts for the same commands.</div></section>
<div class="bottom">Fictional game world · virtual money only</div>
</div>
<script>
(()=>{
const KEY="after-dark-uk-v10";
const fresh={age:18,cash:0,bank:0,job:"Unemployed",wage:0,xp:0,energy:100,rep:0,heat:0,day:1,hour:7,location:"London",rent:650,home:false,faction:null,debt:0};
let state;try{state=JSON.parse(localStorage.getItem(KEY))||{...fresh}}catch(e){state={...fresh}}
const jobs=[["Café assistant",12.5,0],["Retail assistant",12.8,1],["Warehouse operative",13.2,2],["Junior office assistant",13.5,3],["Apprentice electrician",14,4]];
const factions=["Borough Crew","Northline","Kingsway Collective"];
const $=id=>document.getElementById(id),money=n=>"£"+Number(n).toFixed(2);
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function clamp(){state.energy=Math.max(0,Math.min(100,state.energy));state.heat=Math.max(0,Math.min(10,state.heat));state.rep=Math.max(-10,Math.min(20,state.rep))}
function advance(h=1){state.hour+=h;state.energy=Math.max(0,state.energy-h*4);while(state.hour>=24){state.hour-=24;state.day++}}
function say(t){const e=$("log");e.textContent+=(e.textContent?"\n\n":"")+t;e.scrollTop=e.scrollHeight}
function render(){
$("stats").innerHTML=`<div class="stat"><b>Day / time</b><span>${state.day} · ${String(state.hour).padStart(2,"0")}:00</span></div><div class="stat"><b>Cash</b><span>${money(state.cash)}</span></div><div class="stat"><b>Bank</b><span>${money(state.bank)}</span></div><div class="stat"><b>Job</b><span>${state.job}</span></div><div class="stat"><b>Energy</b><span>${state.energy}%</span></div><div class="stat"><b>XP</b><span>${state.xp}</span></div><div class="stat"><b>Rep</b><span>${state.rep}</span></div><div class="stat"><b>Heat</b><span>${state.heat}/10</span></div>`;
$("locationText").textContent=state.location;clamp();save();
}
function listJobs(){say("JOBS:\n"+jobs.map((j,i)=>`${i+1}. ${j[0]} — ${money(j[1])}/hr — requires ${j[2]} XP`).join("\n")+"\n\nType: apply 1, apply café, apply retail, apply warehouse, apply office, or apply electrician.")}
function listMoney(){say(`MONEY:\nCash: ${money(state.cash)}\nBank: ${money(state.bank)}\nRent: ${money(state.rent)}/week\nHome: ${state.home?"Yes":"No"}\nDebt: ${money(state.debt)}`)}
function help(){say("HELP — TEXT COMMANDS:\n\nfind a job / jobs — see available work\napply 1 / apply café — apply for a job\nwork — work a shift\nside job — earn from an odd job\nbeg — ask passers-by for money\ncasino / gamble — gamble in-game cash\nrisky crime — take an abstract risky action\nfaction — meet a fictional group\nstay safe — reduce police heat\nsleep — restore energy and start the next day\ngo street / town / estate / station / home — travel\nmoney — see finances\nstatus — see your current life\nevent — trigger a random event\nhelp — show this list")}
function applyJob(q){q=q.toLowerCase().trim();let i=-1;if(/^\d+$/.test(q))i=Number(q)-1;else i=jobs.findIndex(j=>j[0].toLowerCase().includes(q));if(i<0||!jobs[i]){say("JOB: I couldn't find that job. Type jobs to see the list.");return}let j=jobs[i];if(state.xp<j[2]){say(`JOB: You need ${j[2]} XP for ${j[0]}. You currently have ${state.xp}.`);return}state.job=j[0];state.wage=j[1];state.rep++;say(`JOB: You got the ${j[0]} job at ${money(j[1])}/hour.`);save();render()}
function action(text){
let a=text.trim(),x=a.toLowerCase();if(!a)return;
if(x==="help"||x.includes("what can i do")){help();return}
if(x==="jobs"||x.includes("find a job")||x.includes("look for work")){listJobs();return}
if(x.startsWith("apply")){applyJob(x.replace(/^apply\s*/,""));return}
if(x==="status"||x==="stats"){say(`STATUS: Day ${state.day}, ${String(state.hour).padStart(2,"0")}:00. You are ${state.age}, ${state.job}, with ${money(state.cash)} cash and ${money(state.bank)} in the bank.`);return}
if(x==="money"||x.includes("finances")){listMoney();return}
let r="";
if(x.includes("sleep")){state.energy=100;state.hour=8;state.day++;r="You sleep safely and wake up the next morning feeling rested."}
else if(x.includes("work")){if(state.job==="Unemployed")r="You don't have a job yet. Type 'find a job'.";else if(state.energy<25)r="You're too tired for a full shift. Type 'sleep' first.";else{let p=state.wage*7.5;state.bank+=p;state.xp++;advance(8);r=`You complete a shift as a ${state.job}. ${money(p)} is paid into your bank.`}}
else if(x.includes("side job")||x.includes("odd job")){let g=20+Math.floor(Math.random()*41);state.cash+=g;state.xp++;advance(3);r=`You complete a legitimate odd job and earn ${money(g)}.`}
else if(x.includes("beg")){let g=Math.floor(Math.random()*16);state.cash+=g;state.rep--;advance(2);r=g?`A few passers-by give you ${money(g)}.`:"Nobody gives you anything this time."}
else if(x.includes("casino")||x.includes("gambl")){if(state.cash<1)r="You need at least £1 of in-game cash to gamble.";else{let s=Math.min(state.cash,Math.max(1,Math.floor(state.cash*.25)));if(Math.random()<.45){let w=s*2;state.cash+=w;r=`You win ${money(w)} at the fictional casino.`}else{state.cash-=s;r=`You lose ${money(s)} at the fictional casino.`}advance(1)}}
else if(x.includes("crime")||x.includes("steal")||x.includes("rob")){state.heat=Math.min(10,state.heat+2);state.rep--;advance(2);r="You take an abstract risky-crime action. Police heat rises and the outcome is handled without graphic detail.";if(Math.random()<.35){let g=20+Math.floor(Math.random()*81);state.cash+=g;r+=` This time you gain ${money(g)} in-game.`}}
else if(x.includes("safe")||x.includes("avoid")){state.heat=Math.max(0,state.heat-1);advance(1);r="You keep your head down. Police heat drops slightly."}
else if(x.includes("faction")||x.includes("group")){state.faction=factions[Math.floor(Math.random()*factions.length)];state.rep++;advance(1);r=`You meet the fictional group ${state.faction}. Reputation increases.`}
else if(x.includes("event")){let e=["A café needs cover for a shift.","A warehouse advertises weekend overtime.","Someone offers you a legitimate moving job.","You spot a job advert in a shop window.","A stranger mentions quick money. You decide whether to take the risk."];r="EVENT: "+e[Math.floor(Math.random()*e.length)]}
else if(x.includes("town")){state.location="Town Centre";advance(1);r="TRAVEL: You travel to Town Centre."}
else if(x.includes("street")){state.location="High Street";advance(1);r="TRAVEL: You travel to High Street."}
else if(x.includes("estate")){state.location="Estate";advance(1);r="TRAVEL: You travel to the Estate."}
else if(x.includes("station")){state.location="Train Station";advance(1);r="TRAVEL: You travel to the Train Station."}
else if(x.includes("home")){state.location="Home";advance(1);r=state.home?"TRAVEL: You go home and relax.":"You don't have a home yet. Type 'money' to see your finances."}
else if(x.includes("rent room")){if(state.cash>=200){state.cash-=200;state.home=true;r=`HOME: You rent a basic room. Weekly rent is ${money(state.rent)}.`}else r="HOME: You need £200 for the deposit."}
else if(x.includes("rent")){if(state.bank>=state.rent){state.bank-=state.rent;state.rep++;r="BILLS: You pay your rent."}else r="BILLS: You can't afford the rent yet."}
else{advance(1);r="I don't recognise that command yet. Type 'help' to see what you can do."}
clamp();save();say("YOU: "+a+"\n\n"+r);render();$("actionInput").value="";$("actionInput").focus()}
function newGame(){if(confirm("Start a new V10 game? Your current V10 save will be erased.")){state={...fresh};localStorage.removeItem(KEY);$("log").textContent="";say("DAY 1 — 07:00\n\nYou are 18, unemployed and starting with £0. Type 'find a job' to begin.");render()}}
$("actionInput").addEventListener("keydown",e=>{if(e.key==="Enter")action(e.target.value)});$("sendBtn").addEventListener("click",()=>action($("actionInput").value));$("newGame").addEventListener("click",newGame);render();if(!$("log").textContent)say("DAY 1 — 07:00\n\nYou are 18, unemployed and starting with £0. Type 'help' for commands or 'find a job' to begin.");document.querySelectorAll("#quickActions button").forEach(btn=>btn.addEventListener("click",()=>{action(btn.dataset.cmd);$("actionInput").focus()}));$("actionInput").focus();
})();
</script>
</body>
</html>
