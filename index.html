<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>After Dark UK — V3</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0e1013;color:#f2f4f7;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
.wrap{max-width:1050px;margin:auto;padding:16px}
header{padding:10px 0 16px;border-bottom:1px solid #30343a}
h1{margin:0 0 6px;font-size:clamp(28px,6vw,42px)}
.small{color:#aeb5bf}
.grid{display:grid;grid-template-columns:280px 1fr;gap:14px;margin-top:14px}
.card{background:#181b20;border:1px solid #30343a;border-radius:16px;padding:15px;margin:0 0 12px}
button{background:#272c34;color:#fff;border:1px solid #4b535e;border-radius:10px;padding:11px 13px;margin:4px 4px 4px 0;font-size:15px;cursor:pointer}
button:active{transform:scale(.98)}
button.primary{background:#343b46}
input{width:100%;padding:13px;background:#101216;color:#fff;border:1px solid #444b55;border-radius:10px;font-size:16px}
.stat{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #292d33}
.stat:last-child{border-bottom:0}
.tabs{display:flex;flex-wrap:wrap;gap:5px}
.tabs button{margin:0}
.hidden{display:none!important}
.log{height:390px;overflow:auto;white-space:pre-wrap;line-height:1.55}
.pill{display:inline-block;border:1px solid #454b54;border-radius:999px;padding:4px 8px;margin:2px;color:#cfd4db;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.item{border:1px solid #30343a;border-radius:12px;padding:12px;margin:8px 0}
.notice{padding:10px;border-radius:10px;background:#101216;border:1px solid #30343a;margin:8px 0}
@media(max-width:760px){.grid{grid-template-columns:1fr}.log{height:300px}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>🇬🇧 After Dark: UK</h1>
<div class="small">V3 — UK life simulator · offline playable · online AI can be added safely later</div>
</header>

<div class="grid">
<aside>
<div class="card" id="stats"></div>

<div class="card">
<b>Location</b>
<div id="locationText" class="notice">London</div>
<div class="row">
<button data-move="High Street">High Street</button>
<button data-move="Town Centre">Town Centre</button>
<button data-move="Estate">Estate</button>
<button data-move="Train Station">Train Station</button>
<button data-move="Home">Home</button>
</div>
</div>

<div class="card">
<b>Quick actions</b>
<div class="row">
<button data-action="job">Find a job</button>
<button data-action="work">Work shift</button>
<button data-action="side">Odd job</button>
<button data-action="beg">Beg</button>
<button data-action="steal">Risky theft</button>
<button data-action="gamble">Casino</button>
<button data-action="faction">Meet faction</button>
<button data-action="safe">Stay safe</button>
<button data-action="sleep">Sleep</button>
</div>
</div>
</aside>

<main>
<div class="card tabs">
<button data-tab="story">Story</button>
<button data-tab="jobs">Jobs</button>
<button data-tab="factions">Factions</button>
<button data-tab="money">Money</button>
</div>

<section id="story">
<div class="card">
<input id="actionInput" autocomplete="off" placeholder="Type what you want your character to do…">
<div class="row">
<button id="takeAction" class="primary">Take action</button>
<button id="randomEvent">Random event</button>
</div>
<div class="notice">Try things like: <b>look for work</b>, <b>beg</b>, <b>gamble</b>, <b>sleep</b>, <b>go home</b>, or <b>find a side job</b>.</div>
</div>
<div class="card"><div id="log" class="log"></div></div>
</section>

<section id="jobs" class="hidden">
<div class="card"><h2>Jobs</h2><div id="jobList"></div></div>
</section>

<section id="factions" class="hidden">
<div class="card"><h2>Factions</h2><div id="factionList"></div></div>
</section>

<section id="money" class="hidden">
<div class="card"><h2>Money & bills</h2><div id="moneyPanel"></div></div>
</section>
</main>
</div>
</div>

<script>
(() => {
  const KEY = "after-dark-uk-v3";
  const fresh = {
    age:18, cash:0, bank:0, job:"Unemployed", wage:0, xp:0, energy:100,
    rep:0, heat:0, day:1, hour:7, location:"London", rent:650,
    home:false, faction:null, debt:0, inventory:[]
  };

  let state;
  try { state = JSON.parse(localStorage.getItem(KEY)) || {...fresh}; }
  catch(e) { state = {...fresh}; }

  const jobs = [
    {name:"Café assistant", wage:12.50, xp:0},
    {name:"Retail assistant", wage:12.80, xp:1},
    {name:"Warehouse operative", wage:13.20, xp:2},
    {name:"Junior office assistant", wage:13.50, xp:3},
    {name:"Apprentice electrician", wage:14.00, xp:4}
  ];
  const factions = ["Borough Crew","Northline","Kingsway Collective"];

  const $ = id => document.getElementById(id);
  const money = n => "£" + Number(n).toFixed(2);

  function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
  function clamp(){
    state.energy=Math.max(0,Math.min(100,state.energy));
    state.heat=Math.max(0,Math.min(10,state.heat));
    state.rep=Math.max(-10,Math.min(20,state.rep));
  }
  function advance(hours=1){
    state.hour += hours;
    state.energy = Math.max(0,state.energy - hours*4);
    while(state.hour >= 24){ state.hour -= 24; state.day++; }
  }
  function say(text){
    const el=$("log");
    el.textContent += (el.textContent ? "\n\n" : "") + text;
    el.scrollTop=el.scrollHeight;
  }

  function render(){
    $("stats").innerHTML =
      '<div class="stat"><b>Day / time</b><span>'+state.day+' · '+String(state.hour).padStart(2,"0")+':00</span></div>'+
      '<div class="stat"><b>Cash</b><span>'+money(state.cash)+'</span></div>'+
      '<div class="stat"><b>Bank</b><span>'+money(state.bank)+'</span></div>'+
      '<div class="stat"><b>Job</b><span>'+state.job+'</span></div>'+
      '<div class="stat"><b>Energy</b><span>'+state.energy+'%</span></div>'+
      '<div class="stat"><b>XP</b><span>'+state.xp+'</span></div>'+
      '<div class="stat"><b>Reputation</b><span>'+state.rep+'</span></div>'+
      '<div class="stat"><b>Police heat</b><span>'+state.heat+'/10</span></div>'+
      '<div class="stat"><b>Home</b><span>'+(state.home?"Yes":"None")+'</span></div>'+
      '<div class="stat"><b>Faction</b><span>'+(state.faction||"None")+'</span></div>';

    $("locationText").textContent=state.location;

    $("jobList").innerHTML=jobs.map((j,i)=>
      '<div class="item"><b>'+j.name+'</b><br>'+money(j.wage)+'/hour · XP required '+j.xp+
      '<br><button data-job="'+i+'">Apply</button></div>'
    ).join("");

    $("factionList").innerHTML=factions.map((f,i)=>
      '<div class="item"><b>'+f+'</b><p class="small">Fictional group. Your choices change reputation and consequences.</p>'+
      '<button data-faction="'+i+'">Meet</button></div>'
    ).join("");

    $("moneyPanel").innerHTML=
      '<p>Weekly rent: <b>'+money(state.rent)+'</b></p>'+
      '<p>Food / travel / phone budget: about <b>£80</b> a week.</p>'+
      '<p>Regular weekly costs: about <b>'+money(state.rent+80)+'</b></p>'+
      '<p>Debt: <b>'+money(state.debt)+'</b></p>'+
      '<button id="payRent">Pay rent</button>'+
      (state.home ? "" : '<button id="getHome">Rent a basic room (£200 deposit)</button>');
    clamp();
  }

  function action(text){
    const a=text.trim();
    if(!a) return;
    const x=a.toLowerCase();
    let r="";

    if(x.includes("sleep")){
      state.energy=100; state.hour=8; state.day++;
      r="You find somewhere safe to rest and wake up the next morning. You still have £0, but at least you have energy.";
    } else if(x.includes("job") || x.includes("work")){
      if(x.includes("work") && !x.includes("look") && state.job!=="Unemployed"){
        if(state.energy<25){ r="You're too exhausted to work a full shift. Rest first."; }
        else {
          const pay=state.wage*7.5;
          state.bank+=pay; state.xp++;
          advance(8);
          r="You complete a shift as a "+state.job+". "+money(pay)+" is paid into your bank.";
        }
      } else if(state.job==="Unemployed"){
        r="You look for work. Open the Jobs tab and apply for a position that matches your experience.";
      } else {
        r="You already have a job as a "+state.job+". Try working a shift.";
      }
    } else if(x.includes("beg")){
      const gain=Math.floor(Math.random()*16);
      state.cash+=gain; state.rep-=1; advance(2);
      r=gain===0 ? "You spend some time asking for help but nobody gives you money." :
        "You ask passers-by for help and receive "+money(gain)+". Some people are kind; others ignore you.";
    } else if(x.includes("gambl") || x.includes("casino")){
      if(state.cash<1){
        r="You can't gamble with £0. You need to earn or receive some in-game money first.";
      } else {
        const stake=Math.min(state.cash, Math.max(1,Math.floor(state.cash*0.25)));
        if(Math.random()<0.45){
          const win=stake*2;
          state.cash+=win;
          r="You play a fictional casino game and get lucky. You win "+money(win)+".";
        } else {
          state.cash-=stake;
          r="You lose "+money(stake)+" at the fictional casino. Gambling is risky, and there is no real-money wagering.";
        }
        advance(1);
      }
    } else if(x.includes("steal") || x.includes("rob") || x.includes("crime")){
      state.heat=Math.min(10,state.heat+2);
      state.rep-=1;
      advance(2);
      r="You take a fictional risky-crime action. The outcome is handled abstractly: you might gain money in a future event, but police attention and other consequences can increase. No real-world instructions are provided.";
      if(Math.random()<0.35){ const gain=20+Math.floor(Math.random()*81); state.cash+=gain; r+=" This time, the game awards you "+money(gain)+"."; }
    } else if(x.includes("side") || x.includes("odd job") || x.includes("moving")){
      const gain=20+Math.floor(Math.random()*41);
      state.cash+=gain; state.xp++; advance(3);
      r="You complete a legitimate odd job and earn "+money(gain)+".";
    } else if(x.includes("safe") || x.includes("avoid")){
      state.heat=Math.max(0,state.heat-1); advance(1);
      r="You keep your head down and avoid trouble. Police heat drops slightly.";
    } else if(x.includes("home")){
      if(state.home) r="You head home and take a breather.";
      else r="You don't have a home yet. Open Money to see the room option.";
      advance(1);
    } else if(x.includes("faction") || x.includes("gang")){
      r="You hear about fictional local factions. Open the Factions tab if you want to meet one.";
      advance(1);
    } else {
      advance(1);
      r="The offline game records your action and moves time forward. Later, an online AI narrator can interpret open-ended actions while keeping your money, time and safety rules consistent.";
    }

    clamp(); save();
    say("YOU: "+a+"\n\n"+r);
    $("actionInput").value="";
    render();
  }

  function applyJob(i){
    const j=jobs[i];
    if(state.xp<j.xp){ say("You apply for "+j.name+", but you need "+j.xp+" XP. Keep building experience."); return; }
    state.job=j.name; state.wage=j.wage; state.rep++;
    save(); render();
    say("JOB: You got the "+j.name+" job at "+money(j.wage)+"/hour. You can now work shifts.");
  }

  function meetFaction(i){
    state.faction=factions[i]; state.rep++;
    save(); render();
    say("FACTION: You meet "+state.faction+". It's fictional, and future choices will affect the relationship.");
  }

  function move(where){
    state.location=where; advance(1);
    say("TRAVEL: You travel to "+where+".");
    save(); render();
  }

  function randomEvent(){
    const events=[
      "A café is looking for someone to cover a shift.",
      "A warehouse advertises paid weekend overtime.",
      "Someone offers you a legitimate moving job.",
      "Your phone reminds you that you need somewhere to sleep.",
      "A suspicious stranger mentions quick money. You decide whether the risk is worth it.",
      "A local manager notices your effort and tells you to keep applying."
    ];
    say("EVENT: "+events[Math.floor(Math.random()*events.length)]);
  }

  document.addEventListener("click", e=>{
    const b=e.target.closest("button");
    if(!b) return;
    if(b.dataset.move){ move(b.dataset.move); return; }
    if(b.dataset.action){
      const map={job:"look for a job",work:"work a shift",side:"find a side job",beg:"beg",steal:"risky crime",gamble:"gamble",faction:"meet a faction",safe:"stay safe",sleep:"sleep"};
      action(map[b.dataset.action]); return;
    }
    if(b.dataset.tab){
      ["story","jobs","factions","money"].forEach(id=>$(id).classList.toggle("hidden",id!==b.dataset.tab));
      return;
    }
    if(b.dataset.job!==undefined){ applyJob(Number(b.dataset.job)); return; }
    if(b.dataset.faction!==undefined){ meetFaction(Number(b.dataset.faction)); return; }
    if(b.id==="takeAction"){ action($("actionInput").value); return; }
    if(b.id==="randomEvent"){ randomEvent(); return; }
    if(b.id==="payRent"){
      if(!state.home){ say("You don't currently have a home to pay rent for."); }
      else if(state.bank>=state.rent){ state.bank-=state.rent; state.rep++; say("BILLS: You pay your weekly rent on time."); save(); render(); }
      else say("BILLS: You can't afford the rent yet.");
      return;
    }
    if(b.id==="getHome"){
      if(state.cash>=200){ state.cash-=200; state.home=true; say("HOME: You rent a basic room. Weekly rent is "+money(state.rent)+"."); save(); render(); }
      else say("HOME: You need £200 for the deposit. Find some income first.");
    }
  });

  $("actionInput").addEventListener("keydown",e=>{ if(e.key==="Enter") action(e.target.value); });

  render();
  say("DAY 1 — 07:00\n\nYou are 18, unemployed, homeless and starting with £0 cash and £0 in the bank. Your first goal is simple: survive, find income and decide what kind of life you want.");
})();
</script>
</body>
</html>
