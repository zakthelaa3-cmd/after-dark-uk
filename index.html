<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>After Dark: London V2</title>
<style>
body{margin:0;background:#0e1013;color:#eee;font-family:system-ui,Arial}.wrap{max-width:1000px;margin:auto;padding:18px}header{border-bottom:1px solid #333;padding:14px 0}.grid{display:grid;grid-template-columns:260px 1fr;gap:14px}.card{background:#181b20;border:1px solid #30343a;border-radius:14px;padding:15px;margin:12px 0}button{background:#262b32;color:#fff;border:1px solid #484e57;border-radius:9px;padding:9px 12px;margin:4px;cursor:pointer}input{width:100%;box-sizing:border-box;padding:11px;background:#101216;color:#fff;border:1px solid #444;border-radius:9px;margin:6px 0}.stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #292d33}.tabs button{margin-left:0}.hidden{display:none}.log{height:360px;overflow:auto;white-space:pre-wrap;line-height:1.5}.small{color:#aab0b8}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header><h1>🇬🇧 After Dark: London</h1><div class="small">V2 — UK life simulator · online-AI ready + offline fallback</div></header>
<div class="grid"><aside><div class="card" id="stats"></div><div class="card"><b>Location</b><p id="loc"></p><button onclick="move('High Street')">High Street</button><button onclick="move('Town Centre')">Town Centre</button><button onclick="move('Estate')">Estate</button><button onclick="move('Home')">Home</button></div>
<div class="card"><b>Quick actions</b><br><button onclick="quick('Search for a job')">Job search</button><button onclick="quick('Work a shift')">Work</button><button onclick="quick('Attend a job interview')">Interview</button><button onclick="quick('Find a legal side job')">Side job</button><button onclick="quick('Meet a fictional faction')">Factions</button><button onclick="quick('Consider a risky opportunity')">Risky opportunity</button><button onclick="quick('Avoid trouble')">Stay safe</button><button onclick="quick('Sleep')">Sleep</button></div></aside>
<main><div class="card tabs"><button onclick="tab('story')">Story</button><button onclick="tab('jobs')">Jobs</button><button onclick="tab('factions')">Factions</button><button onclick="tab('money')">Money</button></div>
<section id="story"><div class="card"><input id="action" placeholder="Type anything you want your character to do…"><button onclick="act()">Take action</button><button onclick="event()">Random event</button></div><div class="card"><div class="log" id="log"></div></div></section>
<section id="jobs" class="hidden card"><h2>Jobs</h2><div id="joblist"></div></section>
<section id="factions" class="hidden card"><h2>Factions</h2><p class="small">Fictional groups. The game tracks reputation and consequences without providing real-world criminal instructions.</p><div id="flist"></div></section>
<section id="money" class="hidden card"><h2>Money & bills</h2><div id="money"></div></section>
</main></div></div>
<script>
const base={age:18,cash:47.2,bank:126.84,job:"Unemployed",wage:0,xp:0,energy:100,rep:0,heat:0,day:1,hour:9,location:"London",rent:650,faction:null};
let s=JSON.parse(localStorage.getItem("adl2")||"null")||base;
const jobs=[["Retail assistant",12.8,1],["Warehouse operative",13.2,2],["Café assistant",12.5,1],["Junior office assistant",13.5,3],["Apprentice electrician",10.5,2]];
const factions=["Borough Crew","Northline","Kingsway Collective"];
const £=n=>"£"+n.toFixed(2);
function save(){localStorage.setItem("adl2",JSON.stringify(s))}
function render(){stats.innerHTML=`<div class=stat><b>Day/time</b><span>${s.day} · ${String(s.hour).padStart(2,"0")}:00</span></div><div class=stat><b>Cash</b><span>${£(s.cash)}</span></div><div class=stat><b>Bank</b><span>${£(s.bank)}</span></div><div class=stat><b>Job</b><span>${s.job}</span></div><div class=stat><b>Energy</b><span>${s.energy}%</span></div><div class=stat><b>XP</b><span>${s.xp}</span></div><div class=stat><b>Reputation</b><span>${s.rep}</span></div><div class=stat><b>Police heat</b><span>${s.heat}/10</span></div><div class=stat><b>Faction</b><span>${s.faction||"None"}</span></div>`;loc.textContent=s.location;
joblist.innerHTML=jobs.map((j,i)=>`<div class=card><b>${j[0]}</b><br>${£(j[1])}/hour · XP required ${j[2]}<br><button onclick="apply(${i})">Apply</button></div>`).join("");
flist.innerHTML=factions.map((f,i)=>`<div class=card><b>${f}</b><p>Fictional local faction with its own reputation and story consequences.</p><button onclick="meet(${i})">Meet</button></div>`).join("");
money.innerHTML=`<p>Weekly rent: <b>${£(s.rent)}</b></p><p>Food/travel/phone budget: about <b>£80</b></p><p>Total regular weekly costs: about <b>${£(s.rent+80)}</b></p><button onclick="payRent()">Pay rent</button>`}
function say(t){log.textContent+=(log.textContent?"\\n\\n":"")+t;log.scrollTop=log.scrollHeight}
function advance(h=1){s.hour+=h;s.energy=Math.max(0,s.energy-4*h);while(s.hour>=24){s.hour-=24;s.day++}}
function quick(x){action.value=x;act()}
function act(){let a=action.value.trim();if(!a)return;let x=a.toLowerCase(),r="";
if(x.includes("sleep")){s.energy=100;s.hour=8;s.day++;r="You sleep through the night and wake up feeling better. The bills are still waiting."}
else if(x.includes("job")&&!x.includes("work")){r="You search around London and find several vacancies. Open the Jobs tab to apply."}
else if(x.includes("work")){if(s.job==="Unemployed")r="You need a job first. Open the Jobs tab.";else{let p=s.wage*7.5;s.bank+=p;s.xp++;r=`You finish a shift as a ${s.job}. ${£(p)} goes into your bank.`;advance(8)}}
else if(x.includes("interview")){r="You attend an interview and talk about your strengths. The outcome will depend on your experience and choices.";s.xp++;advance(2)}
else if(x.includes("side")){let p=25+Math.random()*50;s.cash+=p;s.xp++;r=`You complete a legitimate side job and earn ${£(p)}.`;advance(3)}
else if(x.includes("faction")||x.includes("gang")){r="You hear that a fictional faction is recruiting people into its orbit. You can meet them, but association can bring reputation, conflict and police attention.";advance(1)}
else if(x.includes("risk")||x.includes("crime")){s.heat=Math.min(10,s.heat+2);s.rep--;r="A risky opportunity promises quick money. Getting involved could mean police attention, violence, debt or lost job opportunities. The game models consequences but does not provide instructions for real-world crime.";advance(2)}
else if(x.includes("avoid")||x.includes("safe")||x.includes("home")){s.heat=Math.max(0,s.heat-1);r="You avoid trouble and head home. Your police heat drops slightly.";advance(1)}
else{r="The offline engine records that action. In online AI mode, an AI narrator can interpret open-ended actions while obeying the game's money, time and safety rules.";advance(1)}
say("YOU: "+a+"\\n\\n"+r);action.value="";save();render()}
function apply(i){let j=jobs[i];if(s.xp<j[2]){say(`You apply for ${j[0]}, but they want more experience.`);return}s.job=j[0];s.wage=j[1];s.rep++;say(`You get the ${j[0]} job at ${£(j[1])}/hour. You can now work shifts and build experience.`);save();render()}
function meet(i){s.faction=factions[i];s.rep++;say(`You meet ${s.faction}. They remember you now. Your future choices will shape the relationship.`);save();render()}
function move(l){s.location=l;advance();say("You travel to "+l+".");save();render()}
function payRent(){if(s.bank>=s.rent){s.bank-=s.rent;s.rep++;say("You pay your rent on time.");}else say("You cannot afford the rent yet. Find more income or reduce spending.");save();render()}
function event(){let e=["A café needs someone for a shift.","A warehouse advertises weekend overtime.","A friend offers a legitimate paid moving job.","A suspicious stranger offers quick cash.","Your rent reminder appears on your phone.","A manager notices your work and mentions progression."];say("EVENT: "+e[Math.floor(Math.random()*e.length)])}
function tab(id){["story","jobs","factions","money"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id))}
render();say("You wake up in London. You're 18, unemployed, with £47.20 cash and £126.84 in the bank. Rent is £650 a week. Your first goal is to build an income — but the choices you make can take your life in very different directions.");
</script></body></html>
